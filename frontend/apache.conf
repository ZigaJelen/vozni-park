# Brez tega Apache ob zagonu javi opozorilo AH00558 (ime strežnika ni določeno)
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Dnevnik dostopa gre na stdout (glej Dockerfile)
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/html>
        Require all granted
        # SPA: vsaka pot, ki ni datoteka, vrne index.html; usmerjanje opravi React Router
        FallbackResource /index.html
    </Directory>
</VirtualHost>
