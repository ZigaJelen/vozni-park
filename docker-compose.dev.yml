services:
  backend:
    command: flask run --host 0.0.0.0 --port 80 --debug
    volumes:
      - ./backend:/opt/backend

  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:8000}/api
    volumes:
      - ./frontend:/app
      - /app/node_modules