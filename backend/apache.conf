# Brez tega Apache ob zagonu javi opozorilo AH00558 (ime strežnika ni določeno)
ServerName localhost

<VirtualHost *:80>
    WSGIDaemonProcess cars python-home=/opt/venv python-path=/opt/backend processes=2 threads=15
    WSGIProcessGroup cars
    WSGIApplicationGroup %{GLOBAL}

    # Nujno za JWT: brez tega mod_wsgi zavrže glavo Authorization
    WSGIPassAuthorization On

    WSGIScriptAlias / /opt/backend/wsgi.py

    # Dnevnik dostopa: access.log je povezava na stdout (glej Dockerfile),
    # zato so zahtevki vidni v `docker compose logs`
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /opt/backend>
        Require all granted
    </Directory>
</VirtualHost>
